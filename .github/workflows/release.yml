name: Release

# Triggered by pushing a version tag (git tag vX.Y.Z && git push origin vX.Y.Z).
# Builds Glint.zip on a macOS runner and publishes it as a GitHub Release,
# which is what the npx installer downloads.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      - name: Build
        run: xcodebuild -project Glint.xcodeproj -scheme Glint -configuration Release -derivedDataPath build build
      - name: Verify release hardening
        run: |
          APP=build/Build/Products/Release/Glint.app
          if codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q get-task-allow; then
            echo "::error::Release build must not carry the get-task-allow entitlement"
            exit 1
          fi
          if ! codesign -dv "$APP" 2>&1 | grep -q 'flags=.*runtime'; then
            echo "::error::Release build must be signed with the hardened runtime flag"
            exit 1
          fi
      - name: Zip app
        run: ditto -c -k --keepParent build/Build/Products/Release/Glint.app build/Glint.zip
      - name: Sign update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -o pipefail
          curl -sL https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz | tar xJ
          SIGN=$(find . -name sign_update -type f | head -1)
          echo "$SPARKLE_PRIVATE_KEY" | "$SIGN" --ed-key-file - build/Glint.zip | tr -d '\n' > sig.txt
          test -s sig.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" build/Glint.zip --title "Glint ${{ github.ref_name }}" --generate-notes
      - name: Publish appcast entry
        run: |
          python3 .github/update_appcast.py "${{ github.ref_name }}" "$(cat sig.txt)" "$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B appcast-publish origin/master
          # Pin the release the installer fetches, after the release exists, so the
          # pinned asset is always available and the checksum always matches it.
          shasum -a 256 build/Glint.zip | awk '{print $1}' > bin/SHA256
          echo "${{ github.ref_name }}" > bin/RELEASE
          git add appcast.xml bin/SHA256 bin/RELEASE
          git commit -m "Appcast entry and installer pin for ${{ github.ref_name }}"
          git push origin HEAD:master
