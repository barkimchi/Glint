name: Release

# Triggered by pushing a version tag (git tag vX.Y.Z && git push origin vX.Y.Z).
# Builds Glint.zip on a macOS runner and publishes it as a GitHub Release,
# which is what the npx installer downloads.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SIGN_IDENTITY: 'Developer ID Application: Wiezman Kimchi (LEG4Z7RAJV)'
  NOTARY_TEAM_ID: 'LEG4Z7RAJV'

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      - name: Build
        run: xcodebuild -project Glint.xcodeproj -scheme Glint -configuration Release -derivedDataPath build build
      - name: Set up signing keychain
        env:
          DEVID_P12_B64: ${{ secrets.DEVID_P12_B64 }}
          DEVID_P12_PASSWORD: ${{ secrets.DEVID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=ci-signing.keychain-db
          P12=$(mktemp /tmp/devid-XXXXXX.p12)
          trap 'rm -f "$P12"' EXIT
          printf '%s' "$DEVID_P12_B64" | base64 -D > "$P12"
          # Apple-published Developer ID G2 intermediate, pinned by sha256.
          curl -sL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o /tmp/g2ca.cer
          echo 'f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a  /tmp/g2ca.cer' | shasum -a 256 -c -
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import /tmp/g2ca.cer -k "$KEYCHAIN" -T /usr/bin/codesign
          security import "$P12" -k "$KEYCHAIN" -P "$DEVID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$P12"
      - name: Sign with Developer ID
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release/Glint.app
          SPARKLE="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          # Inside-out: XPC services, Updater app, Autoupdate, framework, then the app.
          codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp "$SPARKLE/XPCServices/Downloader.xpc"
          codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp "$SPARKLE/XPCServices/Installer.xpc"
          codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp "$SPARKLE/Updater.app"
          codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp "$SPARKLE/Autoupdate"
          codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp "$APP/Contents/Frameworks/Sparkle.framework"
          codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp "$APP"
      - name: Verify release signature and hardening
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release/Glint.app
          if codesign -d --entitlements - --xml "$APP" 2>/dev/null | grep -q get-task-allow; then
            echo "::error::Release build must not carry the get-task-allow entitlement"
            exit 1
          fi
          if ! codesign -dv "$APP" 2>&1 | grep -q 'flags=.*runtime'; then
            echo "::error::Release build must be signed with the hardened runtime flag"
            exit 1
          fi
          if ! codesign -dv "$APP" 2>&1 | grep -q "Authority=$SIGN_IDENTITY"; then
            echo "::error::Release build must carry the Developer ID Application authority"
            exit 1
          fi
          codesign --verify --deep --strict "$APP"
      - name: Zip app for notarization
        run: ditto -c -k --keepParent build/Build/Products/Release/Glint.app build/Glint.zip
      - name: Notarize with Apple
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          OUT=$(xcrun notarytool submit build/Glint.zip \
            --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" --wait 2>&1) || { echo "notarytool failed:"; printf '%s\n' "$OUT"; exit 1; }
          printf '%s\n' "$OUT"
          printf '%s\n' "$OUT" | grep -q 'status: Accepted' || { echo "::error::Notarization not accepted"; exit 1; }
      - name: Staple notarization ticket
        run: xcrun stapler staple build/Build/Products/Release/Glint.app
      - name: Zip stapled app
        run: |
          rm -f build/Glint.zip
          ditto -c -k --keepParent build/Build/Products/Release/Glint.app build/Glint.zip
      - name: Sign update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # Official Sparkle sign_update from the pinned, checksum-verified release
          # tarball. Extracts to ./bin/sign_update (NOT ./Sparkle-2.10.1/bin/);
          # never use find here - the tarball ships three files named sign_update
          # (this binary, a legacy DSA script, a dSYM) and the wrong match fails
          # silently with its usage text swallowed into sig.txt.
          curl -sL https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz -o /tmp/sparkle.tar.xz
          echo '1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  /tmp/sparkle.tar.xz' | shasum -a 256 -c -
          tar xJf /tmp/sparkle.tar.xz ./bin/sign_update
          KF=$(mktemp)
          trap 'rm -f "$KF"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KF"
          # Keep sign_update's combined output out of the pipe so a failure is loud
          # (its errors go to stdout and previously vanished into sig.txt).
          OUT=$(./bin/sign_update --ed-key-file "$KF" build/Glint.zip 2>&1) || { echo "sign_update failed with: $OUT"; exit 1; }
          printf '%s' "$OUT" | tr -d '\n' > sig.txt
          grep -q 'sparkle:edSignature' sig.txt || { echo "no signature in sign_update output: $OUT"; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" build/Glint.zip --title "Glint ${{ github.ref_name }}" --generate-notes
      - name: Publish appcast entry
        run: |
          python3 .github/update_appcast.py "${{ github.ref_name }}" "$(cat sig.txt)" "$(date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B appcast-publish origin/master
          # Pin the release the installer fetches, after the release exists, so the
          # pinned asset is always available and the checksum always matches it.
          shasum -a 256 build/Glint.zip | awk '{print $1}' > bin/SHA256
          echo "${{ github.ref_name }}" > bin/RELEASE
          git add appcast.xml bin/SHA256 bin/RELEASE
          git commit -m "Appcast entry and installer pin for ${{ github.ref_name }}"
          git push origin HEAD:master
      - name: Tear down signing keychain
        if: always()
        run: security delete-keychain ci-signing.keychain-db || true
