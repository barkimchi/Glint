<!doctype html>
<meta charset="utf-8">
<title>Glint action icons: final set</title>
<style>
  body { margin: 0; padding: 40px 48px; background: #fff; color: #121212; font: 15px/1.45 -apple-system, sans-serif; }
  h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.02em; }
  .sub { color: #555; margin: 0 0 28px; max-width: 760px; }
  .glyphs { display: flex; gap: 8px; }
  .cell { width: 64px; text-align: center; }
  .cell .name { font-size: 12px; color: #666; margin-top: 4px; }
  .small { display: flex; gap: 8px; align-items: center; margin-top: 10px; padding: 8px 12px; border-radius: 10px; width: max-content; }
  .small.dark { background: #1d1d20; }
  .small.light { background: #e9e9ec; }
</style>
<svg width="0" height="0" style="position:absolute">

    <g id="f-ocr"><circle cx="15.5" cy="19.5" r="6" fill="none" stroke="#fff" stroke-width="2.6"/><circle cx="15.5" cy="19.5" r="2.2" fill="#FFB21A"/><path d="M20 15 L25.5 9.5" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></g>
    <g id="f-record"><circle cx="18" cy="18" r="8.5" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="18" cy="18" r="5" fill="#FFB21A"/></g>

<h1>Glint action icons: final set</h1>
<p class="sub">Area from A (dashed selection, amber corner dot); window, fullscreen, scroll, page, OCR and record from C (white outline, solid amber core); Go to Claude uses the official Claude logo in the same amber as the rest. Charcoal tile unchanged.</p>
<div id="root"></div>
<script>
  const names = ["area","window","fullscreen","scroll","page","ocr","record","claude"];
  const use = (id, s) => `<svg width="${s}" height="${s}" viewBox="0 0 36 36"><use href="#plate"/><g transform="translate(0,36) scale(1,-1)"><use href="#${id}"/></g></svg>`;
  // claude path is authored y-down (native SVG); draw it without the flip
  const useClaude = (s) => `<svg width="${s}" height="${s}" viewBox="0 0 36 36"><use href="#plate"/><use href="#f-claude"/></svg>`;
  const cell = (n) => `<div class="cell">${n === "claude" ? useClaude(46) : use(`f-${n}`, 46)}<div class="name">${n}</div></div>`;
  const strip = (cls) => `<div class="small ${cls}">${names.map(n => n === "claude" ? useClaude(18) : use(`f-${n}`, 18)).join("")}</div>`;
  document.getElementById("root").innerHTML =
    `<div class="glyphs">${names.map(cell).join("")}</div>${strip("dark")}${strip("light")}`;
</script>
