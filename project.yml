name: Glint
options:
  bundleIdPrefix: com.barkimchi
  deploymentTarget:
    macOS: "15.0"
targets:
  Glint:
    type: application
    platform: macOS
    sources: [Sources]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Glint
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "Glint records your microphone only when you turn on microphone audio for screen recordings."
        NSHumanReadableCopyright: "Copyright 2026 Bar Kimchi"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barkimchi.glint
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
