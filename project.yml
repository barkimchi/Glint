name: Glint
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
options:
  bundleIdPrefix: com.barkimchi
  deploymentTarget:
    macOS: "15.0"
targets:
  Glint:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: Sparkle
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: Sources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Glint
        CFBundleShortVersionString: "0.1.4"
        CFBundleVersion: "4"
        SUFeedURL: "https://raw.githubusercontent.com/barkimchi/glint-app/master/appcast.xml"
        SUPublicEDKey: "oBidFPnsI1gc/DkdrkZRbErsCahlrjdRDibpGgw2iEo="
        SUEnableAutomaticChecks: true
        NSMicrophoneUsageDescription: "Glint records your microphone only when you turn on microphone audio for screen recordings."
        NSHumanReadableCopyright: "Copyright 2026 Bar Kimchi"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barkimchi.glint
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Release:
          # Hardened runtime on, and no injected get-task-allow: the debug entitlement
          # must not ship in release builds.
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
